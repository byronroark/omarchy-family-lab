name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Check Python syntax
        run: python3 -m py_compile scripts/family-lab
      - name: Check shell syntax
        run: bash -n scripts/preflight.sh
      - name: Verify receiver boundaries
        run: python3 tests/check_receiver.py
      - name: Verify helper routing and forwarding
        run: python3 tests/check_routing.py
      - name: Verify inline backend and native fallback
        run: python3 tests/check_inline.py
      - name: Verify UI action contract
        run: node tests/check_ui_model.cjs
      - name: Verify isolated read-only view
        run: python3 tests/check_tmux.py
      - name: Verify consented control lifecycle
        run: python3 tests/check_control.py
      - name: Verify optional Markdown reporting
        run: python3 tests/check_reporting.py
      - name: Verify child-local policy boundaries (no live installation)
        run: python3 tests/check_parental.py
      - name: Verify staged system installer without system changes
        run: python3 tests/check_parental_installer.py
      - name: Verify Dino presentation and permitted-time forecast
        run: node tests/check_dino_model.cjs && python3 tests/check_next_allowed.py

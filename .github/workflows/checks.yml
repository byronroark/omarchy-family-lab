name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux openssh-server python3-gi gir1.2-gdkpixbuf-2.0
      - name: Check Python syntax
        run: python3 -m py_compile scripts/family-lab
      - name: Check shell syntax
        run: bash -n scripts/preflight.sh
      - name: Verify receiver boundaries
        run: python3 tests/check_receiver.py
      - name: Verify helper routing and forwarding
        run: python3 tests/check_routing.py
      - name: Verify inline backend and native fallback
        run: python3 tests/check_inline.py
      - name: Verify UI action contract
        run: node tests/check_ui_model.cjs
      - name: Verify isolated read-only view
        run: python3 tests/check_tmux.py
      - name: Verify consented control lifecycle
        run: python3 tests/check_control.py
      - name: Verify optional Markdown reporting
        run: python3 tests/check_reporting.py
      - name: Verify child-local policy boundaries (no live installation)
        run: python3 tests/check_parental.py
      - name: Verify staged system installer without system changes
        run: python3 tests/check_parental_installer.py
      - name: Verify Dino presentation and permitted-time forecast
        run: node tests/check_dino_model.cjs && python3 tests/check_next_allowed.py
      - name: Verify persistent Dino authority and learner socket
        run: python3 tests/check_dino_authority.py
      - name: Verify family enrollment and managed desktop files (isolated)
        run: python3 tests/check_enrollment.py && python3 tests/check_helper_identity.py && python3 tests/check_desktop_setup.py
      - name: Verify assistance schemas, software approval and screenshot boundaries
        run: python3 tests/check_software_approval.py && python3 tests/check_menu_approvals.py && /usr/bin/python3 tests/check_help_widget.py
      - name: Verify teaching consent lifecycle with isolated tmux
        run: python3 tests/check_teaching_control.py
      - name: Verify approval-only identities, one-shot worker and parent cards (no installation)
        run: python3 tests/check_delegated_approval.py && python3 tests/check_delegated_setup.py && python3 tests/check_approval_widget.py
      - name: Verify protected breaks, scoped parent cards and controls enrollment (isolated)
        run: python3 tests/check_breaks.py && python3 tests/check_bedtime_power.py && python3 tests/check_policy_client.py && python3 tests/check_policy_setup.py && python3 tests/check_policy_widget.py && python3 tests/check_family_theme.py
      - name: Verify optional Google homepage redirect scope
        run: python3 tests/check_browser_redirect.py
      - name: Verify desktop-first Discord escalation timing and races (offline)
        run: python3 tests/check_escalation.py
      - name: Verify tutoring allowance and restricted gateway (offline)
        run: python3 tests/check_weekly_budget.py && python3 tests/check_luna_gateway.py && python3 tests/check_tutor_setup.py
      - name: Verify local lessons, progression and private parent writing review
        run: python3 tests/check_local_lessons.py
